  async function connect(){let config={accessKeyId:$('#access').value.trim(),secretAccessKey:$('#secret').value,endpoint:$('#endpoint').value.trim().replace(/\/$/,''),bucket:$('#bucket').value.trim(),region:$('#region').value.trim()||'auto'};try{if((!config.accessKeyId||!config.secretAccessKey||!config.endpoint)&&localStorage.rbCredentials&&$('#passphrase').value)config=await readCredentials($('#passphrase').value);if(!config.accessKeyId||!config.secretAccessKey||!config.endpoint)return toast('Please complete credentials and endpoint');if($('#remember').checked&&!$('#passphrase').value)return toast(t('passHint'));AWS.config.update({accessKeyId:config.accessKeyId,secretAccessKey:config.secretAccessKey,region:config.region});state.s3=new AWS.S3({endpoint:config.endpoint,s3ForcePathStyle:true,signatureVersion:'v4',region:config.region});state.config=config;toast(t('loading'));if(config.bucket){state.buckets=[config.bucket];state.bucket=config.bucket}else{let res=await state.s3.listBuckets().promise();state.buckets=res.Buckets.map(x=>x.Name);state.bucket=state.buckets[0]||''}if($('#remember').checked)await storeCredentials(config,$('#passphrase').value);if(state.bucket)await list();app()}catch(e){console.error(e);toast(`${t('error')}: ${e.message||e.code}`,5000)}}
  async function list(){if(!state.bucket)return;let r=await state.s3.listObjectsV2({Bucket:state.bucket,Prefix:state.prefix,Delimiter:'/'}).promise();state.prefixes=(r.CommonPrefixes||[]).map(x=>x.Prefix);state.objects=(r.Contents||[]).filter(x=>x.Key!==state.prefix);state.selected.clear()}

  function bind(){let el=id=>$('#'+id);el('themeBtn')?.addEventListener('click',()=>{state.theme=state.theme==='dark'?'light':'dark';localStorage.rbTheme=state.theme;document.documentElement.dataset.theme=state.theme;app()});el('langBtn')?.addEventListener('click',()=>{state.lang=state.lang==='id'?'en':'id';localStorage.rbLang=state.lang;app()});el('connectBtn')?.addEventListener('click',connect);if(!state.s3)return;document.querySelectorAll('[data-bucket]').forEach(x=>x.onclick=async()=>{state.bucket=x.dataset.bucket;state.prefix='';await list();app()});document.querySelectorAll('[data-path]').forEach(x=>x.onclick=async()=>{state.prefix=x.dataset.path;await list();app()});el('upBtn').onclick=async()=>{let a=state.prefix.split('/').filter(Boolean);a.pop();state.prefix=a.length?a.join('/')+'/':'';await list();app()};el('backBtn').onclick=()=>history.back();el('search').oninput=e=>{state.query=e.target.value;document.querySelector('.file-card').outerHTML=fileTable();bind()};document.querySelectorAll('.check').forEach(x=>x.onclick=e=>{e.stopPropagation();let k=x.closest('.file-row').dataset.key;x.checked?state.selected.add(k):state.selected.delete(k);app()});el('allCheck')?.addEventListener('change',e=>{let a=entries();if(e.target.checked)a.forEach(x=>state.selected.add(x.Key));else state.selected.clear();app()});document.querySelectorAll('[data-open]').forEach(x=>x.ondblclick=()=>open(x.dataset.open));document.querySelectorAll('[data-more]').forEach(x=>x.onclick=e=>{e.stopPropagation();quickMenu(x.dataset.more,x)});el('upload').onclick=()=>$('#filePicker').click();el('newMenu').onclick=newMenu;el('download').onclick=download;el('copy').onclick=()=>clip('copy');el('cut').onclick=()=>clip('cut');el('paste').onclick=paste;el('rename').onclick=rename;el('delete').onclick=del;el('props').onclick=properties;el('settings').onclick=settings;let z=el('dropZone');z.ondragover=e=>{e.preventDefault();z.style.outline='3px dashed var(--blue)'};z.ondragleave=()=>z.style.outline='';z   $('#filePicker').onchange=e=>{upload([...e.target.files]);e.target.value=''};
  function newMenu(){modal(`<h2>${t('new')}</h2><p class="desc">Choose what to create in this folder.</p><div class="modal-actions" style="justify-content:stretch"><button class="btn" id="makeFile" style="flex:1">📄 ${t('newFile')}</button><button class="btn primary" id="makeFolder" style="flex:1">📁 ${t('newFolder')}</button></div>`);$('#makeFolder').onclick=()=>createItem(true);$('#makeFile').onclick=()=>createItem(false)}
  async function createItem(folder){modal(`<h2>${folder?t('newFolder'):t('newFile')}</h2><p class="desc">${folder?'Create a folder in the current location.':t('createFileAsk')}</p><input id="newName" autofocus placeholder="${folder?'Documents':'notes.txt'}"><div class="modal-actions"><button class="btn" id="cancel">${t('cancel')}</button><button class="btn primary" id="create">${t('create')}</button></div>`);$('#cancel').onclick=closeModal;$('#create').onclick=async()=>{let n=$('#newName').value.trim();if(!n)return;try{await state.s3.putObject({Bucket:state.bucket,Key:state.prefix+n+(folder?'/':''),Body:''}).promise();closeModal();await list();app();toast(t('done'))}catch(e){toast(e.message)}}}
  async function upload(files){if(!files?.length)return;for(let f of files){let tr={id:crypto.randomUUID(),file:f,name:f.name,size:f.size,loaded:0,status:'uploading',started:Date.now(),speed:0,parts:[],uploadId:null,cancelled:false,paused:false};state.transfers.unshift(tr);renderTransfers();try{await multipartUpload(tr);tr.status='complete';saveTransfer(tr)}catch(e){tr.status=tr.cancelled?'cancelled':'failed';tr.error=e.message;saveTransfer(tr)}finally{tr.file=null;renderTransfers()}}await list();app()}
  async function multipartUpload(tr){let key=state.prefix+tr.name,partSize=8*1024*1024;if(tr.size<=partSize){await waitTransfer(tr);if(tr.cancelled)throw new Error('Cancelled');let req=state.s3.upload({Bucket:state.bucket,Key:key,Body:tr.file,ContentType:tr.file.type||undefined});tr.abort=()=>req.abort();req.on('httpUploadProgress',p=>updateTransfer(tr,p.loaded||0));await req.promise();updateTransfer(tr,tr.size);return}let init=await state.s3.createMultipartUpload({Bucket:state.bucket,Key:key,ContentType:tr.file.type||undefined}).promise();tr.uploadId=init.UploadId;try{let count=Math.ceil(tr.size/partSize);for(let n=1;n<=count;n++){await waitTransfer(tr);if(tr.cancelled)throw new Error('Cancelled');let start=(n-1)*partSize,end=Math.min(start+partSize,tr.size),base=tr.loaded,req=state.s3.uploadPart({Bucket:state.bucket,Key:key,UploadId:tr.uploadId,PartNumber:n,Body:tr.file.slice(start,end)});tr.abort=()=>req.abort();req.on('httpUploadProgress',p=>updateTransfer(tr,base+(p.loaded||0)));let result=await req.promise();tr.parts.push({ETag:result.ETag,PartNumber:n});updateTransfer(tr,end)}await state.s3.completeMultipartUpload({Bucket:state.bucket,Key:key,UploadId:tr.uploadId,MultipartUpload:{Parts:tr.parts}}).promise()}catch(e){if(tr.uploadId)try{await state.s3.abortMultipartUpload({Bucket:state.bucket,Key:key,UploadId:tr.uploadId}).promise()}catch(_){}throw e}}

  function selected(){return entries().filter(x=>state.selected.has(x.Key))} function clip(type){state.clipboard={type,items:selected()};toast(type==='copy'?t('copied'):t('cutted'));app()}
  async function paste(){let c=state.clipboard;if(!c)return;try{for(let o of c.items){let dest=state.prefix+o.name+(o.folder?'/':'');if(dest===o.Key)continue;if(o.folder){let r=await state.s3.listObjectsV2({Bucket:state.bucket,Prefix:o.Key}).promise();for(let q of r.Contents||[]){await state.s3.copyObject({Bucket:state.bucket,Key:dest+q.Key.slice(o.Key.length),CopySource:`/${state.bucket}/${encodeURIComponent(q.Key).replace(/%2F/g,'/')}`}).promise()}}else await state.s3.copyObject({Bucket:state.bucket,Key:dest,CopySource:`/${state.bucket}/${encodeURIComponent(o.Key).replace(/%2F/g,'/')}`}).promise();if(c.type==='cut')await deleteKey(o.Key,o.folder)}state.clipboard=null;await list();app();toast(t('done'))}catch(e){toast(`${t('error')}: ${e.message}`,5000)}}
  async function deleteKey(key,folder){if(folder){let r=await state.s3.listObjectsV2({Bucket:state.bucket,Prefix:key}).promise();if(r.Contents?.length)await state.s3.deleteObjects({Bucket:state.bucket,Delete:{Objects:r.Contents.map(x=>({Key:x.Key}))}}).promise()}else await state.s3.deleteObject({Bucket:state.bucket,Key:key}).promise()}
  async function del(){let a=selected();modal(`<h2>${t('delete')}?</h2><p class="desc">${t('deleteAsk')}<br><strong>${a.length} ${t('items')}</strong></p><div class="modal-actions"><button class="btn" id="cancel">${t('cancel')}</button><button class="btn danger" id="confirm">${t('delete')}</button></div>`);$('#cancel').onclick=closeModal;$('#confirm').onclick=async()=>{try{for(let x of a)await deleteKey(x.Key,x.folder);closeModal();await list();app();toast(t('done'))}catch(e){toast(e.message,5000)}}}
  async function rename(){let o=selected()[0];modal(`<h2>${t('rename')}</h2><p class="desc">${t('renameAsk')}</p><input id="renameValue" value="${esc(o.name)}"><div class="modal-actions"><button class="btn" id="cancel">${t('cancel')}</button><button class="btn primary" id="confirm">${t('save')}</button></div>`);$('#cancel').onclick=closeModal;$('#confirm').onclick=async()=>{let n=$('#renameValue').value.trim();if(!n||n===o.name)return;try{state.clipboard={type:'cut',items:[o]};let original=state.prefix;state.prefix=state.prefix;await state.s3.copyObject({Bucket:state.bucket,Key:state.prefix+n+(o.folder?'/':''),CopySource:`/${state.bucket}/${encodeURIComponent(o.Key).replace(/%2F/g,'/')}`}).promise();await deleteKey(o.Key,o.folder);state.clipboard=null;closeModal();await list();app();toast(t('done'))}catch(e){toast(e.message)}}}

  async function preview(key){let o=entries().find(x=>x.Key===key), ext=o.name.split('.').pop().toLowerCase(), url=state.s3.getSignedUrl('getObject',{Bucket:state.bucket,Key:key,Expires:900}), type=/^(png|jpg|jpeg|gif|webp|svg)$/.test(ext)?'image':/^(mp4|webm|mov)$/.test(ext)?'video':/^(mp3|wav|ogg)$/.test(ext)?'audio':ext==='pdf'?'pdf':'';if(!type)return toast(t('notPreview'));let body=type==='image'?`<img src="${url}" style="max-width:100%;max-height:60vh;display:block;margin:auto">`:type==='video'?`<video src="${url}" controls autoplay style="width:100%;max-height:60vh"></video>`:type==='audio'?`<audio src="${url}" controls autoplay style="width:100%"></audio>`:`<iframe src="${url}" style="width:100%;height:60vh;border:0"></iframe>`;modal(`<h2>${esc(o.name)}</h2><p class="desc">${t('preview')} · URL expires in 15 minutes</p>${body}<div class="modal-actions"><button class="btn" id="openNew">${t('open')}</button><button class="btn primary" id="close">${t('done')}</button></div>`);$('#close').onclick=closeModal;$('#openNew').onclick=()=>window.open(url,'_blank','noopener')}
  async function properties(){let o=selected()[0];try{let d=o.folder?{}:await state.s3.headObject({Bucket:state.bucket,Key:o.Key}).promise();modal(`<h2>${t('properties')}</h2><p class="desc">${esc(o.name)}</p><dl class="prop-grid"><dt>${t('type')}</dt><dd>${o.folder?t('folder'):(d.ContentType||'—')}</dd><dt>${t('path')}</dt><dd>${esc(o.Key)}</dd><dt>${t('size')}</dt><dd>${o.folder?'—':bytes(d.ContentLength)}</dd><dt>${t('lastModified')}</dt><dd>${date(d.LastModified||o.LastModified)}</dd><dt>${t('etag')}</dt><dd>${d.ETag||o.ETag||'—'}</dd><dt>${t('version')}</dt><dd>${d.VersionId||'—'}</dd><dt>${t('metadata')}</dt><dd>${Object.keys(d.Metadata||{}).length?esc(JSON.stringify(d.Metadata)) : t('none')}</dd></dl><div class="modal-actions"><button class="btn" id="close">${t('done')}</button></div>`);$('#close').onclick=closeModal}catch(e){toast(e.message)}}
  function renderTransfers(){let panel=$('#transferPanel'),toggle=$('#transferToggle');toggle.hidden=!state.s3;if(!state.s3){panel.classList.remove('open');panel.innerHTML='';return}let active=state.transfers.filter(x=>['uploading','paused'].includes(x.status)),history=JSON.parse(localStorage.rbTransferHistory||'[]'),rows=state.transferTab==='active'?active:history;toggle.classList.toggle('active',active.some(x=>x.status==='uploading'));$('#transferCount').textContent=active.length;panel.classList.toggle('open',state.transferOpen);panel.innerHTML=`<div class="transfer-head"><h3>Transfer</h3><button class="icon-btn" id="closeTransfers">×</button></div><div class="transfer-tabs"><button data-tab="active" class="${state.transferTab==='active'?'active':''}">Aktif (${active.length})</button><button data-tab="history" class="${state.transferTab==='history'?'active':''}">Riwayat</button></div>${rows.length?rows.map(x=>{let done=x.loaded??x.size,pct=x.size?Math.min(100,Math.round(done/x.size*100)):100,elapsed=x.started?(Date.now()-x.started)/1000:0,eta=x.speed&&x.status==='uploading'?Math.ceil((x.size-done)/x.speed):0;return `<div class="transfer-item"><div class="transfer-name"><span>${esc(x.name)}</span><small>${x.status==='complete'?'Selesai':x.status==='failed'?'Gagal':x.status==='cancelled'?'Dibatalkan':x.status==='paused'?'Dijeda':'Mengunggah'}</small></div><div class="transfer-meta"><span>${bytes(done)} / ${bytes(x.size)}</span><span>${x.speed?bytes(x.speed)+'/s':''}${eta?' · sisa '+duration(eta):''}</span></div><div class="transfer-progress"><i style="width:${pct}%"></i></div>${x.id?`<div class="transfer-actions"><small>${pct}% · ${duration(elapsed)}</small><span><button data-pause="${x.id}">${x.paused?'▶ Resume':'Ⅱ Pause'}</button><button class="cancel" data-cancel="${x.id}">Cancel</button></span></div>`:''}</div>`}).join(''):'<div class="transfer-empty">Belum ada transfer.</div>'}`;$('#closeTransfers').onclick=()=>{state.transferOpen=false;renderTransfers()};panel   function quickMenu(key,btn){state.selected=new Set([key]);app();requestAnimationFrame(()=>{let freshBtn=document.querySelector(`[data-more="${CSS.escape(key)}"]`);openCtxMenu(key,freshBtn||btn)})}
  function closeCtxMenu(){let m=$('#ctxMenu');if(m){m.classList.remove('show');m.remove()}document.removeEventListener('click',closeCtxMenu,true);document.removeEventListener('scroll',closeCtxMenu,true)}
  function openCtxMenu(key,btn){closeCtxMenu();let o=entries().find(x=>x.Key===key);if(!o||!btn)return;let isFolder=o.folder,items=[];items.push({label:t('open'),ico:'⤢',action:()=>open(key)});if(!isFolder){items.push({label:t('share'),ico:'🔗',action:()=>shareFile(key)});items.push({label:t('download'),ico:'⇩',action:download});}items.push({sep:true});items.push({label:t('copy'),ico:'⧉',action:()=>clip('copy')});items.push({label:t('cut'),ico:'✂',action:()=>clip('cut')});items.push({label:t('rename'),ico:'✎',action:rename});items.push({label:t('properties'),ico:'ⓘ',action:properties});items.push({sep:true});items.push({label:t('delete'),ico:'⌫',action:del,danger:true});let menu=document.createElement('div');menu.className='ctx-menu';menu.id='ctxMenu';menu.innerHTML=items.map(it=>it.sep?'<div class="ctx-sep"></div>':`<button class="ctx-item${it.danger?' danger':''}" data-act="${items.indexOf(it)}"><span class="ico">${it.ico}</span>${it.label}</button>`).join('');document.body.appendChild(menu);let r=btn.getBoundingClientRect(),mw=menu.offsetWidth||200,mh=menu.offsetHeight||280,left=Math.min(r.right-mw,window.innerWidth-mw-8),top=r.bottom+6;if(top+mh>window.innerHeight-8)top=Math.max(8,r.top-mh-6);menu.style.left=Math.max(8,left)+'px';menu.style.top=top+'px';requestAnimationFrame(()=>menu.classList.add('show'));menu.querySelectorAll('.ctx-item').forEach((elm,i)=>{elm.onclick=e=>{e.stopPropagation();closeCtxMenu();items.filter(x=>!x.sep)[i].action()}});setTimeout(()=>{document.addEventListener('click',closeCtxMenu,true);document.addEventListener('scroll',closeCtxMenu,true)},0)}
  function renderQrSvg(text,size){let qr=qrcode(0,'M');qr.addData(text);qr.make();let n=qr.getModuleCount(),cell=size/n,path='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(qr.isDark(r,c))path+=`M${(c*cell).toFixed(2)},${(r*cell).toFixed(2)}h${cell.toFixed(2)}v${cell.toFixed(2)}h${-cell.toFixed(2)}z`;return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="QR code"><rect width="${size}" height="${size}" fill="#fff"/><path d="${path}" fill="#000"/></svg>`}
  function shareFile(key){let o=entries().find(x=>x.Key===key);if(!o)return;let expiries=[{id:'h1',label:t('hour1'),secs:3600},{id:'h6',label:t('hour6'),secs:21600},{id:'d1',label:t('day1'),secs:86400},{id:'d7',label:t('day7'),secs:604800}],current=expiries[0];let renderUrl=()=>state.s3.getSignedUrl('getObject',{Bucket:state.bucket,Key:key,Expires:current.secs});let renderModal=()=>{let url=renderUrl();modal(`<h2>${t('shareTitle')}</h2><p class="desc">${esc(o.name)}</p><p class="desc">${t('shareDesc')}</p><div class="share-expiry">${expiries.map(x=>`<button data-exp="${x.id}" class="${x.id===current.id?'active':''}">${x.label}</button>`).join('')}</div><div class="share-link-row"><input id="shareUrl" readonly value="${esc(url)}"><button class="btn primary" id="shareCopyBtn">${t('shareCopy')}</button></div><div class="share-qr-row"><div class="share-qr-box">${renderQrSvg(url,148)}</div><p class="share-qr-hint">${t('shareQrHint')}</p></div><div class="modal-actions"><button class="btn" id="close">${t('done')}</button></div>`);$('#close').onclick=closeModal;document.querySelectorAll('[data-exp]').forEach(b=>b.onclick=()=>{current=expiries.find(x=>x.id===b.dataset.exp);renderModal()});$('#shareCopyBtn').onclick=async()=>{try{await navigator.clipboard.writeText($('#shareUrl').value);toast(t('shareCopied'))}catch(e){$('#shareUrl').select();document.execCommand('copy');toast(t('shareCopied'))}}};renderModal()}
  function settings(){modal(`<h2>${t('connected')}</h2><p class="desc">${esc(state.config.endpoint)}</p><div class="modal-actions"><button class="btn" id="close">${t('cancel')}</button><button class="btn danger" id="disconnect">${t('disconnect')}</button></div>`);$('#close').onclick=closeModal;$('#disconnect').onclick=()=>{state.s3=null;state.config=null;state.bucket='';state.prefix='';localStorage.removeItem('rbCredentials');closeModal();app()}}
  async function readCredentials(pass){let d=JSON.parse(localStorage.rbCredentials),salt=new Uint8Array(d.salt),iv=new Uint8Array(d.iv),base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']),key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:210000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']),plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,new Uint8Array(d.cipher));return JSON.parse(new TextDecoder().decode(plain))}
  async function storeCredentials(data,pass){let salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:210000,hash:'SHA-256'},await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']),{name:'AES-GCM',length:256},false,['encrypt']);let cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(data)));localStorage.rbCredentials=JSON.stringify({salt:[...salt],iv:[...iv],cipher:[...new Uint8Array(cipher)]})}
  /* Lightweight local player. Object URLs are signed on demand and never persisted. */
  const isAudio=o=>!o.folder&&/\.(mp3|wav|ogg|m4a|aac|flac|opus)$/i.test(o.name||o.Key||'');
  function addSelectedToQueue(){let tracks=selected().filter(isAudio);if(!tracks.length)return toast('Pilih file audio terlebih dahulu');let p=state.player;for(let o of tracks)if(!p.queue.some(q=>q.Key===o.Key))p.queue.push({Key:o.Key,name:o.name||o.Key.split('/').pop()});if(p.index<0)playAt(0);renderPlayer();toast(tracks.length+' file ditambahkan ke antrean')}
  function playAt(index){let p=state.player;if(!p.queue.length)return;if(index<0)index=p.repeat?p.queue.length-1:0;if(index>=p.queue.length)index=p.repeat?0:p.queue.length-1;p.index=index;let track=p.queue[index];p.audio.src=state.s3.getSignedUrl('getObject',{Bucket:state.bucket,Key:track.Key,Expires:3600});p.audio.play().catch(e=>toast(e.message));renderPlayer()}
  function nextTrack(){let p=state.player;if(p.index<p.queue.length-1||p.repeat)playAt(p.index+1);else{p.audio.pause();p.audio.currentTime=0;renderPlayer()}}
  function previousTrack(){let p=state.player;if(p.audio.currentTime>4){p.audio.currentTime=0;return}playAt(p.index-1)}
  function renderPlayer(){let p=state.player,el=$('#mediaPlayer'),qs=$('#queueSelected'),track=p.queue[p.index],a=p.audio;if(qs)qs.hidden=!state.s3||!selected().some(isAudio);if(!state.s3||!p.queue.length){el.classList.remove('show');document.body.classList.remove('player-active','player-queue-open');return}el.classList.add('show');document.body.classList.add('player-active');document.body.classList.toggle('player-queue-open',p.open);el.innerHTML=`<div class="player-main"><div><div class="track-title" id="trackTitle"><span class="marquee-track"><span>♫ ${esc(track?.name||'Tidak ada file')}</span></span></div><div class="track-sub">${p.queue.length} lagu dalam antrean · ${duration(a.currentTime||0)} / ${duration(a.duration||0)}</div></div><div class="player-controls"><button id="prevTrack" title="Previous">‹‹</button><button id="stopTrack" title="Stop">■</button><button class="play" id="playTrack" title="Play/Pause">${a.paused?'▶':'Ⅱ'}</button><button id="nextTrack" title="Next">››</button><button class="${p.repeat?'active':''}" id="repeatTrack" title="Repeat queue">↻</button></div><div class="player-right"><button id="addQueue">＋ <span class="queue-label">Tambah pilihan</span></button><button id="openQueue">☷ ${p.queue.length}</button></div></div><div class="player-queue ${p.open?'open':''}"><div class="queue-tools"><strong>Antrean pemutaran</strong><button id="clearQueue">Kosongkan</button></div>${p.queue.map((q,i)=>`<div class="queue-row ${i===p.index?'current':''}"><span>${i+1}. ${esc(q.name)}</span><button data-play-queue="${i}">▶</button><button data-remove-queue="${i}">×</button></div>`).join('')}</div>`;$('#playTrack').onclick=()=>{a.paused?a.play():a.pause();renderPlayer()};$('#stopTrack').onclick=()=>{a.pause();a.currentTime=0;renderPlayer()};$('#nextTrack').onclick=nextTrack;$('#prevTrack').onclick=previousTrack;$('#repeatTrack').onclick=()=>{p.repeat=!p.repeat;renderPlayer()};$('#openQueue').onclick=()=>{p.open=!p.open;renderPlayer()};$('#addQueue').onclick=addSelectedToQueue;$('#clearQueue').onclick=()=>{a.pause();p.queue=[];p.index=-1;renderPlayer()};el.querySelectorAll('[data-play-queue]').forEach(b=>b.onclick=()=>playAt(+b.dataset.playQueue));el.querySelectorAll('[data-remove-queue]').forEach(b=>b.onclick=()=>{let i=+b.dataset.removeQueue;p.queue.splice(i,1);if(i<p.index)p.index--;if(!p.queue.length){a.pause();p.index=-1}else if(i===p.index)playAt(Math.min(i,p.queue.length-1));renderPlayer()});setupMarquee()}
  function setupMarquee(){let title=$('#trackTitle');if(!title)return;let track=title.querySelector('.marquee-track'),inner=track?.querySelector('span');if(!track||!inner)return;title.classList.remove('marquee');if(track.children.length>1)track.removeChild(track.lastChild);requestAnimationFrame(()=>{let textWidth=inner.getBoundingClientRect().width,overflow=textWidth-title.clientWidth;if(overflow>4){let dist=textWidth+48;title.style.setProperty('--marquee-dist',dist+'px');title.style.setProperty('--marquee-dur',Math.max(6,dist/40)+'s');let clone=inner.cloneNode(true);track.appendChild(clone);title.classList.add('marquee')}else{title.style.removeProperty('--marquee-dist')}})}
  state.player.audio.addEventListener('ended',nextTrack);state.player.audio.addEventListener('play',renderPlayer);state.player.audio.addEventListener('pause',renderPlayer);state.player.audio.addEventListener('timeupdate',()=>{let a=state.player.audio,sub=document.querySelector('#mediaPlayer .track-sub');if(sub&&!a.paused)sub.textContent=`${state.player.queue.length} lagu dalam antrean · ${duration(a.currentTime||0)} / ${duration(a.duration||0)}`});
  $('#transferToggle').onclick=()=>{state.transferOpen=!state.transferOpen;renderTransfers()};
  $('#queueSelected').onclick=addSelectedToQueue;
  // Mobile navigation is a slide-out drawer; event delegation keeps it working after every SPA re-render.
  document.addEventListener('click',e=>{let menu=e.target.closest('.mobile-menu'),side=document.querySelector('.sidebar'),scrim=$('#mobileScrim'),close=()=>{side?.classList.remove('mobile-open');scrim.classList.remove('show')};if(menu&&side){let open=side.classList.toggle('mobile-open');scrim.classList.toggle('show',open);return}if(e.target===scrim){close();return}if(side&&e.target.closest('[data-bucket],[data-path]'))close()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelector('.sidebar')?.classList.remove('mobile-open');$('#mobileScrim').classList.remove('show')}});
  app();
})();
