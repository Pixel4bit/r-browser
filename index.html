    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;font-size:14px;letter-spacing:-.01em} button,input,select{font:inherit} button{color:inherit;cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:260px 1fr}.sidebar{padding:22px 14px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--surface) 84%,transparent);display:flex;flex-direction:column;gap:18px}.brand{display:flex;align-items:center;gap:10px;padding:4px 9px;font-weight:750;font-size:19px;letter-spacing:-.04em}.brandmark{height:29px;width:29px;display:grid;place-items:center;background:linear-gradient(145deg,#38a5ff,#0068dc);border-radius:9px;color:white;font-size:15px;box-shadow:0 4px 10px #007aff55}.side-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:8px 10px}.navitem{border:0;background:transparent;width:100%;display:flex;gap:10px;align-items:center;text-align:left;padding:9px 10px;border-radius:9px}.navitem.active,.navitem:hover{background:var(--blue2);color:var(--blue)}.navitem .ico{font-size:16px;width:18px;text-align:center}.navitem small{margin-left:auto;color:var(--muted)}.bucket-list{overflow:auto;max-height:35vh}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}.privacy{font-size:11px;line-height:1.5;color:var(--muted);padding:0 9px}.main{min-width:0;display:flex;flex-direction:column}.topbar{height:78px;padding:16px 28px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--surface) 90%,transparent);position:sticky;top:0;z-index:4;backdrop-filter:blur(16px)}.nav-controls{display:flex;gap:6px}.icon-btn{width:34px;height:34px;border:0;border-radius:9px;background:transparent;font-size:17px}.icon-btn:hover{background:var(--surface2)}.crumb{display:flex;align-items:center;gap:7px;white-space:nowrap;overfl n{width:27px;text-align:center;font-size:22px}.kind,.date{color:var(--muted);font-size:13px}.row-more{border:0;background:transparent;font-size:19px;border-radius:7px;height:32px}.row-more:hover{background:var(--surface2)}input[type=checkbox]{accent-color:var(--blue);width:16px;height:16px}.empty{padding:75px 20px;text-align:center}.empty .big{font-size:42px}.empty h2{margin:14px 0 6px;font-size:20px}.empty p{color:var(--muted);margin:0}.statusbar{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;padding:12px 4px}.connect-screen{max-width:850px;margin:8vh auto;padding:0 25px}.hero{text-align:center;margin-bottom:30px}.hero .orb{height:56px;width:56px;margin:auto auto 15px;display:grid;place-items:center;border-radius:18px;font-size:27px;color:white;background:linear-gradient(145deg,#54b4ff,#0071e3);box-shadow:0 13px 30px #007aff55}.hero h1{font-size:38px;letter-spacing:-.055em;margin:0}.hero p{color:var(--muted);margin:9px}.connect-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:25px;box-shadow:var(--shadow)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field.full{grid-column:1/-1}.field label{display:block;font-weight:650;font-size:13px;margin:0 0 7px}.field input,.field select{width:100%;height:42px;padding:0 12px;background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:10px;outline:0}.field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #007aff22}.connect-actions{margin-top:20px;display:flex;align-items:center;justify-content:space-between;gap:15px}.remember{display:flex;gap:8px;align-items:center;color:var(--muted)}.hint{margin:18px 2px 0;color:var(--muted);font-size:12px;line-height:1.55}.modal-backdrop{position:fixed;inset:0;background:#0008;z-index:10;display:none;align-items:center;justify-content:center;padding:20px}.modal-backdrop.show{display:flex}.modal{width:min(520px,100%);max-height:85vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:22px}.modal h2{margin:0 0 7px;font-size:21px;letter-spacing:-.03em}.modal .desc{margin:0 0 18px;color:var(--muted);line-height:1.45}.modal input,.modal textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--text);outline:0}.modal textarea{resize:vertical;min-height:80px}.modal input:focus,.modal textarea:focus{border-color:var(--blue)}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.btn{padding:9px 14px;border-radius:9px;border:0;font-weight:650;background:var(--surface2)}.btn.primary{background:var(--blue);color:white}.btn.danger{background:var(--danger);color:white}.prop-grid{display:grid;grid-template-columns:120px 1fr;gap:11px 16px;font-size:13px}.prop-grid dt{color:var(--muted)}.prop-grid dd{margin:0;word-break:break-word}.toast{position:fixed;bottom:24px;left:50%;z-index:30;transform:translate(-50%,120px);background:#222;color:#fff;padding:11px 15px;border-radius:10px;box-shadow:var(--shadow);transition:.25s;font-weight:550}.toast.show{transform:translate(-50%,0)}.progress{position:fixed;inset:auto 24px 20px auto;width:min(360px,calc(100vw - 48px));z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px;box-shadow:var(--shadow);display:none}.progress.show{display:block}.progress-line{height:6px;background:var(--surface2);border-radius:9px;overflow:hidden;margin-top:10px}.progress-line i{display:block;height:100%;background:var(--blue);width:0;transition:.2s}.mobile-menu{display:none}@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{display:none}.topbar{height:64px;padding:10px 14px}.mobile-menu{display:block}.content{padding:19px 14px}.heading-row h1{font-size:24px}.heading-row{align-items:start}.search{width:36px;padding:0;opacity:.8}.table-head,.file-row{grid-template-columns:34px minmax(140px,1fr) 70px 36px}.table-head>*:nth-child(4),.file-row>*:nth-child(4){display:none}.kind{display:none}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.connect-screen{padding:0 16px;margin:5vh auto}.hero h1{font-size:32px}.connect-card{padding:18px}.connect-actions{align-items:stretch;flex-direction:column}.connect-actions .btn{width:100%}.toolbar{gap:2px}.tool{padding:8px}.tool .label{display:none}.sep{margin:0}.file-card{border-radius:12px}}
    .transfer-toggle{position:fixed;right:24px;bottom:22px;z-index:19;background:var(--text);color:var(--surface);border:0;border-radius:12px;padding:10px 13px;box-shadow:var(--shadow);font-weight:650}.transfer-toggle b{display:inline-grid;place-items:center;width:18px;height:18px;background:var(--blue);color:#fff;border-radius:50%;font-size:11px;margin-left:5px}.transfer-panel{position:fixed;z-index:18;right:24px;bottom:70px;width:min(410px,calc(100vw - 32px));max-height:min(590px,calc(100vh - 100px));overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);display:none}.transfer-panel.open{display:block}.transfer-head{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--line)}.transfer-head h3{margin:0;font-size:16px}.transfer-tabs{display:flex;gap:12px;padding:10px 14px 0}.transfer-tabs button{border:0;background:transparent;color:var(--muted);padding:6px 4px;font-weight:650}.transfer-tabs button.active{color:var(--blue);border-bottom:2px solid var(--blue)}.transfer-item{padding:13px 15px;border-bottom:1px solid var(--line)}.transfer-name{display:flex;justify-content:space-between;gap:8px;font-weight:650}.transfer-name span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.transfer-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:6px}.transfer-progress{height:5px;border-radius:6px;overflow:hidden;background:var(--surface2);margin:10px 0}.transfer-progress i{display:block;height:100%;background:var(--blue);transition:width .25s}.transfer-actions{display:flex;justify-content:space-between;align-items:center}.transfer-actions small{color:var(--muted)}.transfer-actions button{border:0;background:var(--surface2);padding:5px 8px;border-radius:7px;margin-left:5px;color:var(--text)}.transfer-actions button.cancel{color:var(--danger)}.transfer-empty{padding:32px;text-align:center;color:var(--muted)}
    .transfer-toggle.active{background:var(--blue);animation:transferPulse 1.5s ease-in-out infinite}.transfer-toggle.active b{background:#fff;color:var(--blue)}@keyframes transferPulse{0%,100%{box-shadow:0 0 0 0 #007aff66,0 8px 18px #007aff44}50%{box-shadow:0 0 0 9px #007aff00,0 10px 24px #007aff66}}
  </style>
</head>
<body>
<div id="app"></div><input id="filePicker" type="file" multiple hidden>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div>
<div class="progress" id="progress"><strong id="progressTitle">Uploading…</strong><span id="progressInfo" style="float:right;color:var(--muted)"></span><div class="progress-line"><i id="progressBar"></i></div></div>
<button class="transfer-toggle" id="transferToggle">⇅ Transfer <b id="transferCount">0</b></button><aside class="transfer-panel" id="transferPanel"></aside>
<div class="toast" id="toast"></div>
<script>
(() => {
  const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const state={lang:localStorage.rbLang||'id',theme:localStorage.rbTheme||'light',s3:null,config:null,bucket:'',prefix:'',objects:[],prefixes:[],selected:new Set(),clipboard:null,view:'files',buckets:[],transfers:[],transferTab:'active',transferOpen:false};
  const text={id:{files:'File',connect:'Hubungkan',access:'Access Key ID',secret:'Secret Access Key',endpoint:'Endpoint S3-compatible',region:'Region',remember:'Ingat koneksi ini',pass:'Passphrase enkripsi',passHint:'Wajib diisi bila koneksi ingin diingat.',buckets:'Bucket',recent:'Terakhir dibuka',upload:'Unggah',download:'Unduh',new:'Baru',copy:'Salin',cut:'Potong',paste:'Tempel',rename:'Ubah nama',delete:'Hapus',properties:'Properti',selectAll:'Pilih semua',deselectAll:'Batal pilih',name:'Nama',size:'Ukuran',modified:'Diubah',empty:'Folder ini kosong',emptySub:'Unggah file atau buat folder baru untuk memulai.',connected:'Terhubung',disconnect:'Putuskan koneksi',newFolder:'Folder baru',newFile:'File baru',create:'Buat',cancel:'Batal',confirm:'Konfirmasi',preview:'Pratinjau',open:'Buka',pasteHere:'Tempel di sini',connectTitle:'S3 Anda, tetap milik Anda.',connectSub:'Browser file pribadi untuk penyimpanan S3-compatible.',cors:'Endpoint harus mengizinkan CORS dari domain GitHub Pages Anda.',loading:'Memuat…',save:'Simpan',folder:'Folder',items:'item',rememberWarning:'Kredensial disimpan terenkripsi AES-GCM; passphrase tidak disimpan.',deleteAsk:'Hapus item yang dipilih? Tindakan ini tidak dapat dibatalkan.',renameAsk:'Masukkan nama baru.',createFileAsk:'Buat file kosong dengan nama:',notPreview:'Pratinjau tidak tersedia untuk tipe file ini.',copied:'Disalin ke clipboard kerja',cutted:'Siap dipindahkan',done:'Selesai',error:'Terjadi kesalahan',chooseBucket:'Pilih bucket untuk mulai',storage:'Penyimpanan',search:'Cari file',drop:'Lepaskan file untuk mengunggah',details:'Detail',type:'Tipe',path:'Path',etag:'ETag',contentType:'Content-Type',lastModified:'Terakhir diubah',metadata:'Metadata',version:'Versi',none:'Tidak ada'},en:{files:'Files',connect:'Connect',access:'Access Key ID',secret:'Secret Access Key',endpoint:'S3-compatible endpoint',region:'Region',remember:'Remember this connection',pass:'Encryption passphrase',passHint:'Required when saving this connection.',buckets:'Buckets',recent:'Recently opened',upload:'Upload',download:'Download',new:'New',copy:'Copy',cut:'Cut',paste:'Paste',rename:'Rename',delete:'Delete',properties:'Properties',selectAll:'Select all',deselectAll:'Deselect all',name:'Name',size:'Size',modified:'Modified',empty:'This folder is empty',emptySub:'Upload files or create a new folder to get started.',connected:'Connected',disconnect:'Disconnect',newFolder:'New folder',newFile:'New file',create:'Create',cancel:'Cancel',confirm:'Confirm',preview:'Preview',open:'Open',pasteHere:'Paste here',connectTitle:'Your S3, still yours.',connectSub:'A private file browser for S3-compatible storage.',cors:'Your endpoint must allow CORS from your GitHub Pages domain.',loading:'Loading…',save:'Save',folder:'Folder',items:'items',rememberWarning:'Credentials are encrypted with AES-GCM; your passphrase is never stored.',deleteAsk:'Delete selected items? This cannot be undone.',renameAsk:'Enter the new name.',createFileAsk:'Create an empty file named:',notPreview:'Preview is unavailable for this file type.',copied:'Copied to working clipboard',cutted:'Ready to move',done:'Done',error:'Something went wrong',chooseBucket:'Choose a bucket to get started',storage:'Storage',search:'Search files',drop:'Drop files to upload',details:'Details',type:'Type',path:'Path',etag:'ETag',contentType:'Content-Type',lastModified:'Last modified',metadata:'Metadata',version:'Version',none:'None'}};
  const t=k=>text[state.lang][k]||k; const icon=o=>o.folder?'📁':(/\.(png|jpe?g|gif|webp|svg)$/i.test(o.name)?'🖼️':/\.(mp4|mov|webm)$/i.test(o.name)?'🎬':/\.(mp3|wav|ogg)$/i.test(o.name)?'🎵':/\.(pdf)$/i.test(o.name)?'📕':/\.(zip|rar|7z)$/i.test(o.name)?'🗜️':'📄');
  const bytes=value=>{let n=Number(value);if(!Number.isFinite(n))return '—';if(n===0)return '0 B';let units=['B','KB','MB','GB','TB'],i=Math.min(Math.floor(Math.log(n)/Math.log(1024)),units.length-1);return `${(n/1024**i).toFixed(i?1:0)} ${units[i]}`};
  const duration=value=>{let s=Math.max(0,Math.round(Number(value)||0)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60,p=n=>String(n).padStart(2,'0');return h?`${p(h)}:${p(m)}:${p(sec)}`:`${p(m)}:${p(sec)}`};
  const date=v=>v?new Intl.DateTimeFormat(state.lang==='id'?'id-ID':'en-US',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v)):'—';
  /*
   * Architecture overview
   * - Connection: AWS SDK signs S3-compatible requests in the browser. No R-Browser server receives keys.
   * - Storage: only optional remembered credentials and transfer history use localStorage. Credentials are
   *   encrypted with AES-GCM using a passphrase that is never saved.
   * - R2 use: provide a bucket name to avoid the account-level ListBuckets request, which browsers may block.
   * - Transfers: uploads larger than 8 MB use S3 multipart upload. Pause applies between parts; Cancel aborts
   *   the multipart session. The transfer panel is deliberately independent from the page render.
   *
   * Deployment note: configure your bucket's CORS policy for every origin that will host this file.
   * See README-v1.md for a copy-ready policy and provider-specific directions.
   */
  document.documentElement.dataset.theme=state.theme;
  function toast(msg,ms=2800){const e=$('#toast');e.textContent=msg;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),ms)}
  function modal(html){$('#modal').innerHTML=html;$('#modalBackdrop').classList.add('show')} function closeModal(){$('#modalBackdrop').classList.remove('show')} $('#modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')closeModal()};
  function app(){ $('#app').innerHTML=state.s3?browser():connectPage(); bind(); renderTransfers(); }
  function connectPage(){return `<main class="connect-screen"><section class="hero"><div class="orb">R</div><h1>R-Browser</h1><p>${t('connectSub')}</p></section><section class="connect-card"><div class="form-grid"><div class="field"><label>${t('access')}</label><input id="access" autocomplete="username" placeholder="AKIA…"></div><div class="field"><label>${t('secret')}</label><input id="secret" type="password" autocomplete="current-password" placeholder="••••••••••••••••"></div><div class="field full"><label>${t('endpoint')}</label><input id="endpoint" type="url" placeholder="https://<account>.r2.cloudflarestorage.com"></div><div class="field"><label>Bucket name <span style="color:var(--blue)">(R2)</span></label><input id="bucket" placeholder="my-bucket"></div><div class="field"><label>${t('region')}</label><input id="region" value="auto" placeholder="auto"></div><div class="field full"><label>${t('pass')}</label><input id="passphrase" type="password" placeholder="${t('passHint')}"></div></div><div class="connect-actions"><label class="remember"><input id="remember" type="checkbox"> ${t('remember')}</label><button class="btn primary" id="connectBtn">${t('connect')} <span>→</span></button></div><p class="hint">Untuk Cloudflare R2, isi <strong>Bucket name</strong> agar koneksi langsung dibuka tanpa meminta daftar bucket.<br>${t('rememberWarning')}<br>${t('cors')}</p></section><div style="text-align:center;margin-top:18px"><button class="icon-btn" id="themeBtn" title="Theme">${state.theme==='dark'?'☀︎':'◐'}</button><button class="icon-btn" id="langBtn">${state.lang==='id'?'EN':'ID'}</button></div></main>`}
  function browser(){let has=state.selected.size;return `<div class="app"><aside class="sidebar"><div class="brand"><span class="brandmark">R</span> R-Browser</div><div><div class="side-label">${t('storage')}</div><button class="navitem active"><span class="ico">▣</span>${t('files')}<small>${state.bucket||''}</small></button></div><div><div class="side-label">${t('buckets')}</div><div class="bucket-list">${state.buckets.map(b=>`<button class="navitem ${b===state.bucket?'active':''}" data-bucket="${esc(b)}"><span class="ico">◒</span><span class="filename">${esc(b)}</span></button>`).join('')||'<div class="privacy">—</div>'}</div></div><div class="side-bottom"><button class="navitem" id="settings"><span class="ico">⚙</span>${t('connected')}</button><p class="privacy">R-Browser runs entirely in your browser. No files or keys pass through our server.</p></div></aside><main class="main"><header class="topbar"><button class="icon-btn mobile-menu">☰</button><div class="nav-controls"><button class="icon-btn" id="backBtn" title="Back">‹</button><button class="icon-btn" id="upBtn" title="Up">⌃</button></div><nav class="crumb">${crumbs()}</nav><input class="search" id="search" placeholder="⌕ ${t('search')}"><button class="icon-btn" id="themeBtn">${state.theme==='dark'?'☀︎':'◐'}</button><button class="icon-btn" id="langBtn">${state.lang==='id'?'EN':'ID'}</button></header><section class="content" id="dropZone"><div class="heading-row"><div><h1>${esc(state.prefix.split('/').filter(Boolean).pop()||state.bucket||t('files'))}</h1><p class="sub">${state.bucket?esc(state.bucket)+' · ':''}${state.objects.length+state.prefixes.length} ${t('items')}</p></div></div><div class="toolbar"><button class="tool primary" id="upload"><span>⇧</span><span class="label">${t('upload')}</span></button><button class="tool" id="newMenu"><span>＋</span><span class="label">${t('new')}</span></button><i class="sep"></i><button class="tool" id="download" ${!has?'disabled':''}><span>⇩</span><span class="label">${t('download')}</span></button><button class="tool" id="copy" ${!has?'disabled':''}>⧉ <span class="label">${t('copy')}</span></button><button class="tool" id="cut" ${!has?'disabled':''}>✂ <span class="label">${t('cut')}</span></button><button class="tool" id="paste" ${!state.clipboard?'disabled':''}>▣ <span class="label">${t('paste')}</span></button><i class="sep"></i><button class="tool" id="rename" ${state.selected.size!==1?'disabled':''}>✎ <span class="label">${t('rename')}</span></button><button class="tool" id="props" ${state.selected.size!==1?'disabled':''}>ⓘ <span class="label">${t('properties')}</span></button><button class="tool" id="delete" ${!has?'disabled':''} style="color:var(--danger)">⌫ <span class="label">${t('delete')}</span></button></div>${fileTable()}<div class="statusbar"><span>${has?state.selected.size+' '+t('items')+' '+(state.lang==='id'?'dipilih':'selected'):state.bucket?'':t('chooseBucket')}</span><span>${state.prefix||'/'}</span></div></section></main></div>`}
  function crumbs(){let arr=state.prefix.split('/').filter(Boolean), out=`<button data-path="">${esc(state.bucket||t('files'))}</button>`;let p='';arr.forEach(x=>{p+=x+'/';out+=`<span>›</span><button data-path="${esc(p)}">${esc(x)}</button>`});return out}
  function entries(){return [...state.prefixes.map(Key=>({Key, name:Key.slice(state.prefix.length,-1),folder:true})),...state.objects.map(x=>({...x,name:x.Key.slice(state.prefix.length)}))]}
  function fileTable(){let rows=entries().filter(o=>o.name.toLowerCase().includes((state.query||'').toLowerCase()));if(!state.bucket)return `<div class="file-card"><div class="empty"><div class="big">◒</div><h2>${t('chooseBucket')}</h2></div></div>`;if(!rows.length)return `<div class="file-card"><div class="empty"><div class="big">☁</div><h2>${t('empty')}</h2><p>${t('emptySub')}</p></div></div>`;return `<div class="file-card"><div class="table-head"><input id="allCheck" type="checkbox" ${state.selected.size===rows.length?'checked':''}><div>${t('name')}</div><div>${t('size')}</div><div>${t('modified')}</div><div></div></div>${rows.map(o=>`<div class="file-row ${state.selected.has(o.Key)?'selected':''}" data-key="${esc(o.Key)}"><input class="check" type="checkbox" ${state.selected.has(o.Key)?'checked':''}><div class="namecell" data-open="${esc(o.Key)}"><span class="fileicon">${icon(o)}</span><span class="filename">${esc(o.name)}</span></div><div class="kind">${o.folder?t('folder'):(o.ContentType||o.name.split('.').pop()?.toUpperCase()||'File')}</div><div class="date">${o.folder?'—':date(o.LastModified)}</div><button class="row-more" data-more="${esc(o.Key)}">•••</button></div>`).join('')}</div>`}
  async function connect(){let config={accessKeyId:$('#access').value.trim(),secretAccessKey:$('#secret').value,endpoint:$('#endpoint').value.trim().replace(/\/$/,''),bucket:$('#bucket').value.trim(),region:$('#region').value.trim()||'auto'};try{if((!config.accessKeyId||!config.secretAccessKey||!config.endpoint)&&localStorage.rbCredentials&&$('#passphrase').value)config=await readCredentials($('#passphrase').value);if(!config.accessKeyId||!config.secretAccessKey||!config.endpoint)return toast('Please complete credentials and endpoint');if($('#remember').checked&&!$('#passphrase').value)return toast(t('passHint'));AWS.config.update({accessKeyId:config.accessKeyId,secretAccessKey:config.secretAccessKey,region:config.region});state.s3=new AWS.S3({endpoint:config.endpoint,s3ForcePathStyle:true,signatureVersion:'v4',region:config.region});state.config=config;toast(t('loading'));if(config.bucket){state.buckets=[config.bucket];state.bucket=config.bucket}else{let res=await state.s3.listBuckets().promise();state.buckets=res.Buckets.map(x=>x.Name);state.bucket=state.buckets[0]||''}if($('#remember').checked)await storeCredentials(config,$('#passphrase').value);if(state.bucket)await list();app()}catch(e){console.error(e);toast(`${t('error')}: ${e.message||e.code}`,5000)}}
  async function list(){if(!state.bucket)return;let r=await state.s3.listObjectsV2({Bucket:state.bucket,Prefix:state.prefix,Delimiter:'/'}).promise();state.prefixes=(r.CommonPrefixes||[]).map(x=>x.Prefix);state.objects=(r.Contents||[]).filter(x=>x.Key!==state.prefix);state.selected.clear()}
  async function open(key){let e=entries().find(x=>x.Key===key);if(e?.folder){state.prefix=key;await list();app()}else preview(key)}
  function bind(){let el=id=>$('#'+id);el('themeBtn')?.addEventListener('click',()=>{state.theme=state.theme==='dark'?'light':'dark';localStorage.rbTheme=state.theme;document.documentElement.dataset.theme=state.theme;app()});el('langBtn')?.addEventListener('click',()=>{state.lang=state.lang==='id'?'en':'id';localStorage.rbLang=state.lang;app()});el('connectBtn')?.addEventListener('click',connect);if(!state.s3)return;document.querySelectorAll('[data-bucket]').forEach(x=>x.onclick=async()=>{state.bucket=x.dataset.bucket;state.prefix='';await list();app()});document.querySelectorAll('[data-path]').forEach(x=>x.onclick=async()=>{state.prefix=x.dataset.path;await list();app()});el('upBtn').onclick=async()=>{let a=state.prefix.split('/').filter(Boolean);a.pop();state.prefix=a.length?a.join('/')+'/':'';await list();app()};el('backBtn').onclick=()=>history.back();el('search').oninput=e=>{state.query=e.target.value;document.querySelector('.file-card').outerHTML=fileTable();bind()};document.querySelectorAll('.check').forEach(x=>x.onclick=e=>{e.stopPropagation();let k=x.closest('.file-row').dataset.key;x.checked?state.selected.add(k):state.selected.delete(k);app()});el('allCheck')?.addEventListener('change',e=>{let a=entries();if(e.target.checked)a.forEach(x=>state.selected.add(x.Key));else state.selected.clear();app()});document.querySelectorAll('[data-open]').forEach(x=>x.ondblclick=()=>open(x.dataset.open));document.querySelectorAll('[data-more]').forEach(x=>x.onclick=e=>{e.stopPropagation();quickMenu(x.dataset.more)});el('upload').onclick=()=>$('#filePicker').click();el('newMenu').onclick=newMenu;el('download').onclick=download;el('copy').onclick=()=>clip('copy');el('cut').onclick=()=>clip('cut');el('paste').onclick=paste;el('rename').onclick=rename;el('delete').onclick=del;el('props').onclick=properties;el('settings').onclick=settings;let z=el('dropZone');z.ondragover=e=>{e.preventDefault();z.style.outline='3px dashed var(--blue)'};z.ondragleave=()=>z.style.outline='';z.o   $('#filePicker').onchange=e=>{upload([...e.target.files]);e.target.value=''};
  function newMenu(){modal(`<h2>${t('new')}</h2><p class="desc">Choose what to create in this folder.</p><div class="modal-actions" style="justify-content:stretch"><button class="btn" id="makeFile" style="flex:1">📄 ${t('newFile')}</button><button class="btn primary" id="makeFolder" style="flex:1">📁 ${t('newFolder')}</button></div>`);$('#makeFolder').onclick=()=>createItem(true);$('#makeFile').onclick=()=>createItem(false)}
  async function createItem(folder){modal(`<h2>${folder?t('newFolder'):t('newFile')}</h2><p class="desc">${folder?'Create a folder in the current location.':t('createFileAsk')}</p><input id="newName" autofocus placeholder="${folder?'Documents':'notes.txt'}"><div class="modal-actions"><button class="btn" id="cancel">${t('cancel')}</button><button class="btn primary" id="create">${t('create')}</button></div>`);$('#cancel').onclick=closeModal;$('#create').onclick=async()=>{let n=$('#newName').value.trim();if(!n)return;try{await state.s3.putObject({Bucket:state.bucket,Key:state.prefix+n+(folder?'/':''),Body:''}).promise();closeModal();await list();app();toast(t('done'))}catch(e){toast(e.message)}}}
  async function upload(files){if(!files?.length)return;for(let f of files){let tr={id:crypto.randomUUID(),file:f,name:f.name,size:f.size,loaded:0,status:'uploading',started:Date.now(),speed:0,parts:[],uploadId:null,cancelled:false,paused:false};state.transfers.unshift(tr);renderTransfers();try{await multipartUpload(tr);tr.status='complete';saveTransfer(tr)}catch(e){tr.status=tr.cancelled?'cancelled':'failed';tr.error=e.message;saveTransfer(tr)}finally{tr.file=null;renderTransfers()}}await list();app()}
  async function multipartUpload(tr){let key=state.prefix+tr.name,partSize=8*1024*1024;if(tr.size<=partSize){await waitTransfer(tr);if(tr.cancelled)throw new Error('Cancelled');let req=state.s3.upload({Bucket:state.bucket,Key:key,Body:tr.file,ContentType:tr.file.type||undefined});tr.abort=()=>req.abort();req.on('httpUploadProgress',p=>updateTransfer(tr,p.loaded||0));await req.promise();updateTransfer(tr,tr.size);return}let init=await state.s3.createMultipartUpload({Bucket:state.bucket,Key:key,ContentType:tr.file.type||undefined}).promise();tr.uploadId=init.UploadId;try{let count=Math.ceil(tr.size/partSize);for(let n=1;n<=count;n++){await waitTransfer(tr);if(tr.cancelled)throw new Error('Cancelled');let start=(n-1)*partSize,end=Math.min(start+partSize,tr.size),base=tr.loaded,req=state.s3.uploadPart({Bucket:state.bucket,Key:key,UploadId:tr.uploadId,PartNumber:n,Body:tr.file.slice(start,end)});tr.abort=()=>req.abort();req.on('httpUploadProgress',p=>updateTransfer(tr,base+(p.loaded||0)));let result=await req.promise();tr.parts.push({ETag:result.ETag,PartNumber:n});updateTransfer(tr,end)}await state.s3.completeMultipartUpload({Bucket:state.bucket,Key:key,UploadId:tr.uploadId,MultipartUpload:{Parts:tr.parts}}).promise()}catch(e){if(tr.uploadId)try{await state.s3.abortMultipartUpload({Bucket:state.bucket,Key:key,UploadId:tr.uploadId}).promise()}catch(_){}throw e}}

  function renderTransfers(){let panel=$('#transferPanel'),active=state.transfers.filter(x=>['uploading','paused'].includes(x.status)),history=JSON.parse(localStorage.rbTransferHistory||'[]'),rows=state.transferTab==='active'?active:history;$('#transferCount').textContent=active.length;panel.classList.toggle('open',state.transferOpen);panel.innerHTML=`<div class="transfer-head"><h3>Transfer</h3><button class="icon-btn" id="closeTransfers">×</button></div><div class="transfer-tabs"><button data-tab="active" class="${state.transferTab==='active'?'active':''}">Aktif (${active.length})</button><button data-tab="history" class="${state.transferTab==='history'?'active':''}">Riwayat</button></div>${rows.length?rows.map(x=>{let pct=x.size?Math.round((x.loaded||x.size)/x.size*100):100,eta=x.speed&&x.status==='uploading'?Math.ceil((x.size-x.loaded)/x.speed):0;return `<div class="transfer-item"><div class="transfer-name"><span>${esc(x.name)}</span><small>${x.status==='complete'?'Selesai':x.status==='failed'?'Gagal':x.status==='cancelled'?'Dibatalkan':x.status==='paused'?'Dijeda':'Mengunggah'}</small></div><div class="transfer-meta"><span>${bytes(x.loaded||x.size)} / ${bytes(x.size)}</span><span>${x.speed?bytes(x.speed)+'/s':''}${eta?' · '+eta+' dtk':''}</span></div><div class="transfer-progress"><i style="width:${pct}%"></i></div>${x.id?`<div class="transfer-actions"><small>${pct}%</small><span><button data-pause="${x.id}">${x.paused?'▶ Resume':'Ⅱ Pause'}</button><button class="cancel" data-cancel="${x.id}">Cancel</button></span></div>`:''}</div>`}).join(''):'<div class="transfer-empty">Belum ada transfer.</div>'}`;$('#closeTransfers').onclick=()=>{state.transferOpen=false;renderTransfers()};panel.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.transferTab=b.dataset.tab;renderTransfers()});panel.querySelectorAll('[data-pause]').forEach(b=>b.onclick=()=>{let x=state.transfers.find(q=>q.id===b.dataset.pause);x.paused=!x.paused;renderTransfers()});panel.querySelect   function selected(){return entries().filter(x=>state.selected.has(x.Key))} function clip(type){state.clipboard={type,items:selected()};toast(type==='copy'?t('copied'):t('cutted'));app()}
  async function paste(){let c=state.clipboard;if(!c)return;try{for(let o of c.items){let dest=state.prefix+o.name+(o.folder?'/':'');if(dest===o.Key)continue;if(o.folder){let r=await state.s3.listObjectsV2({Bucket:state.bucket,Prefix:o.Key}).promise();for(let q of r.Contents||[]){await state.s3.copyObject({Bucket:state.bucket,Key:dest+q.Key.slice(o.Key.length),CopySource:`/${state.bucket}/${encodeURIComponent(q.Key).replace(/%2F/g,'/')}`}).promise()}}else await state.s3.copyObject({Bucket:state.bucket,Key:dest,CopySource:`/${state.bucket}/${encodeURIComponent(o.Key).replace(/%2F/g,'/')}`}).promise();if(c.type==='cut')await deleteKey(o.Key,o.folder)}state.clipboard=null;await list();app();toast(t('done'))}catch(e){toast(`${t('error')}: ${e.message}`,5000)}}

  async function del(){let a=selected();modal(`<h2>${t('delete')}?</h2><p class="desc">${t('deleteAsk')}<br><strong>${a.length} ${t('items')}</strong></p><div class="modal-actions"><button class="btn" id="cancel">${t('cancel')}</button><button class="btn danger" id="confirm">${t('delete')}</button></div>`);$('#cancel').onclick=closeModal;$('#confirm').onclick=async()=>{try{for(let x of a)await deleteKey(x.Key,x.folder);closeModal();await list();app();toast(t('done'))}catch(e){toast(e.message,5000)}}}
  async function rename(){let o=selected()[0];modal(`<h2>${t('rename')}</h2><p class="desc">${t('renameAsk')}</p><input id="renameValue" value="${esc(o.name)}"><div class="modal-actions"><button class="btn" id="cancel">${t('cancel')}</button><button class="btn primary" id="confirm">${t('save')}</button></div>`);$('#cancel').onclick=closeModal;$('#confirm').onclick=async()=>{let n=$('#renameValue').value.trim();if(!n||n===o.name)return;try{state.clipboard={type:'cut',items:[o]};let original=state.prefix;state.prefix=state.prefix;await state.s3.copyObject({Bucket:state.bucket,Key:state.prefix+n+(o.folder?'/':''),CopySource:`/${state.bucket}/${encodeURIComponent(o.Key).replace(/%2F/g,'/')}`}).promise();await deleteKey(o.Key,o.folder);state.clipboard=null;closeModal();await list();app();toast(t('done'))}catch(e){toast(e.message)}}}

  async function preview(key){let o=entries().find(x=>x.Key===key), ext=o.name.split('.').pop().toLowerCase(), url=state.s3.getSignedUrl('getObject',{Bucket:state.bucket,Key:key,Expires:900}), type=/^(png|jpg|jpeg|gif|webp|svg)$/.test(ext)?'image':/^(mp4|webm|mov)$/.test(ext)?'video':/^(mp3|wav|ogg)$/.test(ext)?'audio':ext==='pdf'?'pdf':'';if(!type)return toast(t('notPreview'));let body=type==='image'?`<img src="${url}" style="max-width:100%;max-height:60vh;display:block;margin:auto">`:type==='video'?`<video src="${url}" controls autoplay style="width:100%;max-height:60vh"></video>`:type==='audio'?`<audio src="${url}" controls autoplay style="width:100%"></audio>`:`<iframe src="${url}" style="width:100%;height:60vh;border:0"></iframe>`;modal(`<h2>${esc(o.name)}</h2><p class="desc">${t('preview')} · URL expires in 15 minutes</p>${body}<div class="modal-actions"><button class="btn" id="openNew">${t('open')}</button><button class="btn primary" id="close">${t('done')}</button></div>`);$('#close').onclick=closeModal;$('#openNew').onclick=()=>window.open(url,'_blank','noopener')}
  async function properties(){let o=selected()[0];try{let d=o.folder?{}:await state.s3.headObject({Bucket:state.bucket,Key:o.Key}).promise();modal(`<h2>${t('properties')}</h2><p class="desc">${esc(o.name)}</p><dl class="prop-grid"><dt>${t('type')}</dt><dd>${o.folder?t('folder'):(d.ContentType||'—')}</dd><dt>${t('path')}</dt><dd>${esc(o.Key)}</dd><dt>${t('size')}</dt><dd>${o.folder?'—':bytes(d.ContentLength)}</dd><dt>${t('lastModified')}</dt><dd>${date(d.LastModified||o.LastModified)}</dd><dt>${t('etag')}</dt><dd>${d.ETag||o.ETag||'—'}</dd><dt>${t('version')}</dt><dd>${d.VersionId||'—'}</dd><dt>${t('metadata')}</dt><dd>${Object.keys(d.Metadata||{}).length?esc(JSON.stringify(d.Metadata)) : t('none')}</dd></dl><div class="modal-actions"><button class="btn" id="close">${t('done')}</button></div>`);$('#close').onclick=closeModal}catch(e){toast(e.message)}}
  function renderTransfers(){let panel=$('#transferPanel'),active=state.transfers.filter(x=>['uploading','paused'].includes(x.status)),history=JSON.parse(localStorage.rbTransferHistory||'[]'),rows=state.transferTab==='active'?active:history,toggle=$('#transferToggle');toggle.classList.toggle('active',active.some(x=>x.status==='uploading'));$('#transferCount').textContent=active.length;panel.classList.toggle('open',state.transferOpen);panel.innerHTML=`<div class="transfer-head"><h3>Transfer</h3><button class="icon-btn" id="closeTransfers">×</button></div><div class="transfer-tabs"><button data-tab="active" class="${state.transferTab==='active'?'active':''}">Aktif (${active.length})</button><button data-tab="history" class="${state.transferTab==='history'?'active':''}">Riwayat</button></div>${rows.length?rows.map(x=>{let done=x.loaded??x.size,pct=x.size?Math.min(100,Math.round(done/x.size*100)):100,elapsed=x.started?(Date.now()-x.started)/1000:0,eta=x.speed&&x.status==='uploading'?Math.ceil((x.size-done)/x.speed):0;return `<div class="transfer-item"><div class="transfer-name"><span>${esc(x.name)}</span><small>${x.status==='complete'?'Selesai':x.status==='failed'?'Gagal':x.status==='cancelled'?'Dibatalkan':x.status==='paused'?'Dijeda':'Mengunggah'}</small></div><div class="transfer-meta"><span>${bytes(done)} / ${bytes(x.size)}</span><span>${x.speed?bytes(x.speed)+'/s':''}${eta?' · sisa '+duration(eta):''}</span></div><div class="transfer-progress"><i style="width:${pct}%"></i></div>${x.id?`<div class="transfer-actions"><small>${pct}% · ${duration(elapsed)}</small><span><button data-pause="${x.id}">${x.paused?'▶ Resume':'Ⅱ Pause'}</button><button class="cancel" data-cancel="${x.id}">Cancel</button></span></div>`:''}</div>`}).join(''):'<div class="transfer-empty">Belum ada transfer.</div>'}`;$('#closeTransfers').onclick=()=>{state.transferOpen=false;renderTransfers()};panel.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.transferTab=b.dataset.tab;renderTransfers()});panel.querySelectorAll('[data-pause]').forEach(b=>b.onclick=()=>{let x=state.transfers.find(q=>q.id===b.dataset.pause);x.paused=!x.paused;renderTransfers()});panel.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{let x=state.transfers.find(q=>q.id===b.dataset.cancel);x.cancelled=true;x.paused=false;x.abort?.();renderTransfers()})}
  function quickMenu(key){state.selected=new Set([key]);app();let o=entries().find(x=>x.Key===key);if(o.folder)return;preview(key)}
  function settings(){modal(`<h2>${t('connected')}</h2><p class="desc">${esc(state.config.endpoint)}</p><div class="modal-actions"><button class="btn" id="close">${t('cancel')}</button><button class="btn danger" id="disconnect">${t('disconnect')}</button></div>`);$('#close').onclick=closeModal;$('#disconnect').onclick=()=>{state.s3=null;state.config=null;state.bucket='';state.prefix='';localStorage.removeItem('rbCredentials');closeModal();app()}}
  async function readCredentials(pass){let d=JSON.parse(localStorage.rbCredentials),salt=new Uint8Array(d.salt),iv=new Uint8Array(d.iv),base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']),key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:210000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']),plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,new Uint8Array(d.cipher));return JSON.parse(new TextDecoder().decode(plain))}
